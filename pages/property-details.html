<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | Real Estate</title>
  <link rel="icon" type="image/png" href="../logo/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-light">
  <div class="container my-4" id="detailsContainer">
    <a href="properties.html" class="btn btn-sm btn-outline-secondary mb-3">
      <i class="fa-solid fa-arrow-left me-1"></i> Back to Properties
    </a>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm overflow-hidden mb-3">
          <img id="mainImage" src="https://via.placeholder.com/800x450?text=Loading+Image..." class="img-fluid" style="height: 400px; object-fit: cover; width: 100%;" alt="Property Image">
        </div>
        <div class="bg-white p-4 rounded shadow-sm mb-4">
          <div class="d-flex gap-2 mb-2">
            <span id="badgeListing" class="badge bg-warning text-dark"></span>
            <span id="badgeType" class="badge bg-dark"></span>
          </div>
          <p class="text-muted mb-3">
            <i class="fa-solid fa-location-dot"></i>
            <span id="propertyLocation"></span>
          </p>
            <div class="text-muted small">Price</div>
            <h2 id="propertyPrice" class="text-success fw-bold mb-3">Lakh</h2>

          <div class="row property-features g-2 mt-2 align-items-center">
            <div class="col-12 text-uppercase text-muted fw-semibold small mb-1">Created By</div>
            <div class="col-md-4">
              <i class="fa-solid fa-user text-dark me-2"></i>
              <strong id="authorName"></strong>
            </div>
            <div class="col-md-4">
              <i class="fa-solid fa-phone  me-2"></i>
              <a id="authorPhone" class="text-decoration-none text-dark">N/A</a>
            </div>
            <div class="col-md-4">
              <i class="fa-solid fa-envelope me-2"></i>
              <a id="authorEmail" class="text-decoration-none text-dark">N/A</a>
            </div>
          </div>
        </div>
        <div class="bg-white p-3 rounded shadow-sm mb-4">
          <div class="row text-center">
            <div class="col-3">
              <i class="fa-solid fa-bed  mb-1"></i>
              <div class="small text-muted">Bedrooms</div>
              <strong id="featureBeds"> Beds</strong>
            </div>
            <div class="col-3 border-start">
              <i class="fa-solid fa-bath fa-lg mb-1"></i>
              <div class="small text-muted">Bathrooms</div>
              <strong id="featureBaths"> Baths</strong>
            </div>
            <div class="col-3 border-start">
              <i class="fa-regular fa-square mb-1"></i>
              <div class="small text-muted">Area</div>
              <strong id="featureArea"> sqft</strong>
            </div>
            <div class="col-3 border-start">
              <i class="fa-solid fa-stairs mb-1"></i>
              <div class="small text-muted">Floor</div>
              <strong id="featureFloor">Floor</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

        
  <script src="../js/property-details.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
