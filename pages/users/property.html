<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Property | Real Estate</title>
    <link rel="icon" type="image/png" href="../../logo/logo.png">
    <link rel="stylesheet" href="../../css/profile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="dashboard-body">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h4 class="sidebar-title">Your Profile</h4>
        </div>

        <ul class="nav flex-column sidebar-nav">
            <li class="nav-item">
                <a href="profile.html" class="nav-link">
                    <i class="fa-solid fa-gear"></i>
                    <span>Account Setting</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="property.html" class="nav-link active">
                    <i class="bi bi-building"></i>
                    <span>Your Properties</span>
                </a>
            </li>
            <li class="nav-item mt-auto">
            <button class="nav-link text-danger" role="button" onclick="backbtn()">
                       <i class="bi bi-box-arrow-right"></i>
                    <span>Back</span>
            </button>
            </li>
        </ul>
    </aside>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Your Properties</h2>
                <p class="text-muted mb-0">Manage your properties.</p>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Property Name</th>
                                <th>Type</th>
                                <th>Listing</th>
                                <th>Township</th>
                                <th>City</th>
                                <th>Bedrooms</th>
                                <th>Bathrooms</th>
                                <th>Floor</th>
                                <th>Area</th>
                                <th>Price</th>
                                <th>Image</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="propertyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="../../js/user/property-view.js"></script>
    <script src="../../js/navbar.js"></script>
</body>
</html>
