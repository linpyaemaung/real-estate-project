<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="icon" type="image/png" href="../../logo/logo.png">
    <link rel="stylesheet" href="../../css/profile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
     
<body class="dashboard-body">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h4 class="sidebar-title">Your Profile</h4>
        </div>

        <ul class="nav flex-column sidebar-nav">
            <li class="nav-item">
                <a href="profile.html" class="nav-link active">
                    <i class="fa-solid fa-gear"></i>
                    <span>Account Setting</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="property.html" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Your Properties</span>
                </a>
            </li>
            <li class="nav-item mt-auto">
                 <button class="nav-link text-danger" role="button" onclick="backbtn()">
                       <i class="bi bi-box-arrow-right"></i>
                    <span>Back</span>
                 </button>
            </li>
        </ul>
    </aside>
    <main class="main-content">
        <div class="container-fluid px-4 py-4">
            <div class="mb-4">
                <h4 class="fw-bold text-dark mb-1">My Profile</h4>
            </div>
            <div class="card content-card mb-4">
                <div class="card-body p-4 d-flex align-items-center gap-4">
                    <div class="profile-avatar-wrapper">
                        <img id="image" alt="User Image">
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-1" id="profile-display-name">User Account</h4>
                        <p class="text-muted small mb-0"><i class="fa-solid fa-user"></i> User Account</p>
                    </div>
                </div>
            </div>
            <div class="card content-card">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold text-dark m-0">Personal Information</h5>
                        <a href="profile-edit.html" class="btn btn-edit-profile">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Edit Profile
                        </a>
                    </div>
                    <div class="row g-4">
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="info-group">
                                <label class="info-label">Full Name</label>
                                <span id="name" class="info-value">--</span>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="info-group">
                                <label class="info-label">Email Address</label>
                                <span id="email" class="info-value">--</span>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="info-group">
                                <label class="info-label">Phone Number</label>
                                <span id="phone" class="info-value">--</span>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="info-group">
                                <label class="info-label">User Type</label>
                                <span id="userType" class="info-value text-capitalize">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/user/profile.js"></script>
    <script src="../../js/navbar.js"></script>
</body>
</html>
