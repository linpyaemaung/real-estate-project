<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
  <link rel="icon" type="image/png" href="../../logo/logo.png">
  <link rel="stylesheet" href="../css/user-style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    .back-arrow{
        text-align:center;
    }
  </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card w-75 m-auto">
            <div class="row g-0">
                <div class="col-md-4">
                <img src="../../images/signin.jpeg" class="img-fluid rounded-start h-100" alt="image">
                </div>
                <div class="col-md-8">
                <div class="card-body">
                            <form id="loginForm" style="margin-top: 40px;">
                                <h2 class="text-center mb-4">User Login</h2>
                                <div class="mb-3">
                                    <label class="form-label"> Email</label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter your email"required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <div class="position-relative">
                                        <input type="password" id="password" class="form-control pe-5" placeholder="Enter your password" required>
                                        <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword"></i>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-dark w-100">Login</button>
                                <div class="text-center mt-3">
                                    If you don't have an account, <a href="register.html">Sign Up</a>
                                </div>
                            </form>
                        <div id="message" class="mt-3"></div>
                </div>
                </div>
            </div>
        </div>
    </div>
    <div class="back-arrow mt-2">
              <i class="fa-solid fa-arrow-left-long"></i> <a href="../../index.html" class="text-decoration-none text-dark">Back to Website</a>
    </div>
    <script src="../../js/user/login.js"></script>
</body>

</html>
