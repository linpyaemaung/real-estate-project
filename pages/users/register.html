<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Register | Real Estate</title>
      <link rel="icon" type="image/png" href="../../logo/logo.png">
  <link rel="stylesheet" href="../../css/user-style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container mt-4">
        <div class="card">
            <div class="row g-0">
                <div class="col-md-4">
                    <img src="../../images/licensed-image.jpeg" class="property-image rounded-start h-100" alt="image">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h2 class="text-center mb-4">  User Register </h2>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label"> Name </label>
                                <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"> Email  </label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"> Password </label>
                                    <div class="position-relative">
                                        <input type="password" id="password" class="form-control pe-5" placeholder="Enter your password" required>
                                        <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword" style="cursor: pointer;"></i>
                                    </div>
                             </div>
                            <div class="mb-3">
                                <label for="userRole" class="form-label custom-select-label">Select Role</label>
                                <div class="custom-select-wrapper">
                                    <select class="form-select custom-select" id="userRole" required>
                                        <option value="" selected disabled>Choose your role...</option>
                                        <option value="Property's Owner">Property's Owner</option>
                                        <option value="Agent">Agent</option>
                                    </select>
                                </div>
                            </div>
                                                            
                            <div class="mb-3">
                                        <label class="form-label"> Profile Image </label>
                                        <input type="file" id="profile_image" class="form-control" accept="image/*" required>
                                        <div class="text-center mt-3">
                                            <img id="imagePreview" src="" alt="Profile Preview" class="rounded-circle d-none" width="120" height="120" style="object-fit: cover;">
                                        </div>
                            </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Phone
                                    </label>
                                    <input type="text" id="phone" class="form-control" placeholder="Enter your phone number" required>
                                </div>
                                <button type="submit" class="btn btn-dark w-100"> Register</button>
                                  <div class="text-center mt-3">
                                      Already have an account?, <a href="login.html">Sign In</a>
                                 </div>
                        </form>
                            <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/user/register.js"></script>
</body>
</html>
