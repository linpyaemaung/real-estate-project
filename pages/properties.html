<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bgcolor sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><div class="text-white">Real Estate</div></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 navbar-bg">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="properties.html">Properties</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="aboutus.html">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contactus.html">Contact Us</a>
          </li>
        </ul>
        <div class="d-flex">
          <button type="button" class="login-btn">
                <a href="../users/login.html"><i class="fa-regular fa-user"></i> Login</a>
          </button>
        </div>
      </div>
    </div>
  </nav>
  <div class="properties mt-4">
    <h3>All Properties</h3>
   <button type="button" class="btn btn-dark me-2" onclick="filterProperties('all')"> All</button>
    <button type="button" class="btn btn-outline-dark me-2" onclick="filterProperties('sale')"> Sale </button>
    <button type="button" class="btn btn-outline-dark" onclick="filterProperties('rent')"> Rent </button>
   <div id="propertyContainer" class="row"></div>
    <div id="propertyTemplate" class="property-card col-md-4 mt-3 d-none">
      <div class="card h-100 shadow-sm">
        <img class="property-image img-fluid mb-2" style="height: 200px; width: 100%; object-fit: cover;">
        <div class="property-info p-3 d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="badge bg-warning text-white text-uppercase listing_type"></span>
            </div>
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="badge bg-dark text-white text-uppercase px-2 py-1 property_type"></span>
            </div>
            <div class="row">
              <div class="col">
                <h5 class="property-name fw-bold"></h5>
              </div>
              <div class="col-5 text-end">
                <p class="property-price fw-bold"></p>
              </div>
            </div>
            <div class="location mt-1">
              <i class="fa-solid fa-location-dot"></i>
              <span class="property-location text-muted small"></span>
            </div>

            <div class="property-icon-list d-flex gap-3 mt-4 text-muted small">
              <div class="property-icon">
                <i class="fa-solid fa-bed me-1"></i>
                <span class="property-bed"></span> beds
              </div>
              <div class="property-icon">
                <i class="fa-solid fa-bath me-1"></i>
                <span class="property-bath"></span> baths
              </div>
              <div class="property-icon">
                <i class="fa-regular fa-square me-1"></i>
                <span class="property-area"></span> sqft
              </div>
              <div class="property-icon">
                <i class="fa-solid fa-stairs me-1"></i>
                <span class="property-floor"></span> floors
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-dark mt-2 w-100"><a href="property-details.html" class="text-decoration-none text-white">View Details</a></button>
        </div>
      </div>
    </div>
  </div>

  <footer>
      <div class="row mt-3">
        <div class="col-9">
          <h5>Real Estate</h5>
          <p>Supporting visitors in making confident and well-informed property decisions</p>
        </div>
        <div class="col">
          <h5>Contact</h5>
          <p>Email:linpyaemg.lpmaung@gmail.com</p>
          <p>Phone: +95259294449</p>
        </div>
      </div>
      </div>
  </footer>
  <div class="sub-footer text-center text-white p-2">
    © 2026 Real Estate. All rights reserved
  </div>
  <script src="../js/property-page.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
