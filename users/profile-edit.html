<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Real Estate</title>
    <link rel="icon" type="image/png" href="../logo/logo.png">
    <link rel="stylesheet" href="../css/user-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="sidebar">
        <h4 class="sidebar-title">Your Profile</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="index.html" class="nav-link active"><i class="fa-solid fa-gear"></i> Account Setting</a>
            </li>
            <li class="nav-item">
                <a href="property.html" class="nav-link"><i class="bi bi-building"></i> Your Properties</a>
            </li>
            <li class="nav-item">
                <a href="login.html" id="logoutButton" class="nav-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </li>
        </ul>
    </div>
    <div class="main-content">
        <div class="container mt-5">
            <h3 class="mb-4">Edit Profile</h3>
            <div class="card profile-card shadow-sm border-0">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <label for="imageInput" style="cursor: pointer;">
                            <div class="rounded-circle overflow-hidden" style="width: 120px; height: 120px;">
                                <img id="image" src="" alt="Profile Image" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                        </label>
                        <input type="file" id="imageInput" accept="image/*" hidden>
                        <p class="text-muted mt-2">Click the image to change</p>
                    </div>
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" id="phone" class="form-control">
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-xmark me-2"></i>Cancel</a>
                            <button type="submit" class="btn btn-dark"><i class="fa-solid fa-check me-2"></i>Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/user/profile-edit.js"></script>
</body>
</html>
