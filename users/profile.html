<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
<link rel="icon" type="image/png" href="../logo/logo.png">
    <link rel="stylesheet" href="../css/user-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

 <div class="sidebar">
        <h4 class="sidebar-title">
            Your Profile       
        </h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="profile.html" class="nav-link active">
                     <i class="fa-solid fa-gear"></i>
                    Account Setting
                </a>
            </li>
            <li class="nav-item">
                <a href="property.html" class="nav-link">
                    <i class="bi bi-building"></i>
                        Your  Properties
                </a>
            </li>
            <li class="nav-item">
                <a href="login.html" id="logoutButton" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>
        </ul>
</div>

<div class="main-content">
    <div class="container mt-5">
        <div class="card profile-card shadow-sm border-0">
            <div class="card-body">
                   <h3>Personal Information</h3>
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center overflow-hidden"
                        style="width: 100px; height: 100px;">
                        <img id="image" alt="User Image" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>   
                <div class="mb-3">
                    <label for="nameInput" class="form-label"> Name: </label>
                     <span id="name"></span>
                </div>
                <div class="mb-3">
                    <label for="email-label" class="form-label">Email Address:</label>
                    <span id="email"></span>
                </div>
                <div class="mb-3">
                    <label for="phone-label" class="form-label">Phone Number: </label>
                    <span id="phone"></span>
                </div>
                <button class="btn btn-dark"><a href="profile-edit.html">Edit Profile</a></button>
            </div>
        </div>
    </div>
</div>


<script src="../js/user/profile.js"></script>
</body>
</html>
