<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | Real Estate</title>
    <link rel="icon" type="image/png" href="../logo/logo.png">
    <link rel="stylesheet" href="../css/user-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="sidebar">
        <h4 class="sidebar-title">Your Profile</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="profile.html" class="nav-link"><i class="fa-solid fa-gear"></i> Account Setting</a>
            </li>
            <li class="nav-item">
                <a href="property.html" class="nav-link active"><i class="bi bi-building"></i> Your Properties</a>
            </li>
            <li class="nav-item">
                <a href="login.html" id="logoutButton" class="nav-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </li>
        </ul>
    </div>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Add Property</h2>
                <p class="text-muted mb-0">Add your property details below.</p>
            </div>
            <a href="property.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0"><i class="fa-solid fa-house"></i> Property Information</h4>
            </div>
            <div class="card-body">
                <form id="propertyForm">
                    <div class="mb-3">
                        <label for="property_name" class="form-label">Property Name</label>
                        <input type="text" id="property_name" class="form-control" placeholder="Enter property name" required>
                    </div>
                    <div class="mb-3">
                        <label for="property_type" class="form-label">Property Type</label>
                        <select id="property_type" class="form-select" required>
                            <option value="">Select Property Type</option>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Condo">Condo</option>
                            <option value="Land">Land</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="listing_type" class="form-label">Listing Type</label>
                        <select id="listing_type" class="form-select" required>
                            <option value="">Select Listing Type</option>
                            <option value="Sale">Sale</option>
                            <option value="Rent">Rent</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="township" class="form-label">Township</label>
                        <input type="text" id="township" class="form-control" placeholder="Enter township" required>
                    </div>
                    <div class="mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" id="city" class="form-control" placeholder="Enter city" required>
                    </div>
                    <div class="mb-3">
                        <label for="bed_room" class="form-label">Bedrooms</label>
                        <input type="number" id="bed_room" class="form-control" min="0" placeholder="e.g. 3" required>
                    </div>
                    <div class="mb-3">
                        <label for="bath_number" class="form-label">Bathrooms</label>
                        <input type="number" id="bath_number" class="form-control" min="0" placeholder="e.g. 2" required>
                    </div>
                    <div class="mb-3">
                        <label for="property_area" class="form-label">Property Area</label>
                        <input type="text" id="property_area" class="form-control" placeholder="e.g. 1200 sqft" required>
                    </div>
                    <div class="mb-3">
                        <label for="floor" class="form-label">Floor</label>
                        <input type="number" id="floor" class="form-control" min="0" placeholder="e.g. 5" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" id="price" class="form-control" min="0" placeholder="Enter price" required>
                    </div>
                    <div class="mb-3">
                        <label for="propertyImage" class="form-label">Property Image</label>
                        <input type="file" id="propertyImage" class="form-control" accept="image/*" required>
                        <div class="form-text">Please select one property image.</div>
                    </div>
                    <div id="imagePreviewContainer" class="row mb-4"></div>
                    <div class="d-flex gap-2">
                        <a href="property.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Property</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/user/add-property.js"></script>
</body>
</html>
